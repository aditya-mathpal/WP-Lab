<h2>Human Database</h2>

<form method="post">
    {% csrf_token %}

    <label>Select First Name:</label>
    <select name="first_name" onchange="this.form.submit()">
        <option value="">--Select--</option>
        {% for h in humans %}
            <option value="{{ h.first_name }}"
            {% if selected and h.first_name == selected.first_name %}selected{% endif %}>
                {{ h.first_name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Last Name:</label>
    <input type="text" name="last_name" value="{{ selected.last_name|default:'' }}"><br>

    <label>Phone:</label>
    <input type="text" name="phone" value="{{ selected.phone|default:'' }}"><br>

    <label>Address:</label>
    <input type="text" name="address" value="{{ selected.address|default:'' }}"><br>

    <label>City:</label>
    <input type="text" name="city" value="{{ selected.city|default:'' }}"><br>

    <br>

    <button type="submit" name="action" value="update">Update</button>
    <button type="submit" name="action" value="delete">Delete</button>

</form>
