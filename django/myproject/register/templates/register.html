<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<form method="POST">
    {% csrf_token %}
    
    <p>
        {{ form.username.label_tag }}<br>
        {{ form.username }}
    </p>

    <p>
        {{ form.password.label_tag }}<br>
        {{ form.password }}
    </p>

    <p>
        {{ form.email.label_tag }}<br>
        {{ form.email }}
    </p>

    <p>
        {{ form.contact.label_tag }}<br>
        {{ form.contact }}
    </p>

    <button type="submit">Submit</button>

</form>

</body>
</html>
