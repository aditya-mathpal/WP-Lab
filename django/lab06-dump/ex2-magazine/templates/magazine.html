{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Cover</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">

        <div class="form-section">
            <h2>Design Cover</h2>

            <label>Image</label>
            <input type="file" id="imageInput">

            <label>Background</label>
            <input type="color" id="bgColor" value="#ffffff">

            <label>Font Color</label>
            <input type="color" id="fontColor" value="#ffffff">

            <label>Font Size</label>
            <input type="number" id="fontSize" value="42" min="20" max="100">

            <label>Headline</label>
            <input type="text" id="headlineInput" placeholder="Main Headline">

            <label>Subtitle</label>
            <input type="text" id="subtitleInput" placeholder="Subtitle text">
        </div>

        <div class="cover" id="cover">
            <img id="coverImage">
            <div class="overlay"></div>
            <div class="text">
                <h1 id="headline">MAGAZINE TITLE</h1>
                <p id="subtitle">Your subtitle appears here</p>
            </div>
        </div>

    </div>

    <script>
    const imageInput = document.getElementById("imageInput");
    const bgColor = document.getElementById("bgColor");
    const fontColor = document.getElementById("fontColor");
    const fontSize = document.getElementById("fontSize");
    const headlineInput = document.getElementById("headlineInput");
    const subtitleInput = document.getElementById("subtitleInput");

    const cover = document.getElementById("cover");
    const coverImage = document.getElementById("coverImage");
    const headline = document.getElementById("headline");
    const subtitle = document.getElementById("subtitle");

    bgColor.oninput = () => cover.style.backgroundColor = bgColor.value;

    fontColor.oninput = () => {
        headline.style.color = fontColor.value;
        subtitle.style.color = fontColor.value;
    };

    fontSize.oninput = () => headline.style.fontSize = fontSize.value + "px";

    headlineInput.oninput = () => headline.textContent = headlineInput.value;

    subtitleInput.oninput = () => subtitle.textContent = subtitleInput.value;

    imageInput.onchange = () => {
        const file = imageInput.files[0];
        if (file) {
            coverImage.src = URL.createObjectURL(file);
            coverImage.style.display = "block";
        }
    };
    </script>
</body>
</html>
