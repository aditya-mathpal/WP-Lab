<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balanced Split Layout</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<style>
    .half-height {
        height: 50vh;
        display: flex;
        align-items: center;
    }
</style>
</head>
<body>

<div class="container-fluid vh-100 d-flex flex-column">

    <div class="row half-height px-lg-5">
        <div class="col-12">
            <div class="p-4 bg-white border rounded shadow-sm">
                <h5 class="mb-3 text-primary">Top Half Container</h5>

                <div class="form-row align-items-center mb-3">
                    <div class="col-md-5 mb-2 mb-md-0">
                        <input type="search" class="form-control form-control-lg" placeholder="Search something...">
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <select class="custom-select custom-select-lg">
                            <option selected>Category</option>
                            <option>Files</option>
                            <option>Users</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <div class="btn-toolbar w-100">
                            <button class="btn btn-primary btn-lg mr-2 flex-fill">Go</button>
                            <button class="btn btn-outline-dark btn-lg flex-fill">Filters</button>
                        </div>
                    </div>
                </div>

                <div>
                    <span class="badge badge-success badge-pill px-3 py-2">Active</span>
                    <span class="badge badge-dark badge-pill px-3 py-2">Lab Node</span>
                    <span class="badge badge-light border px-3 py-2">3 Alerts</span>
                </div>
            </div>
        </div>
    </div>

    <hr class="m-0 border-primary" style="border-width:2px; opacity:.25;">

    <div class="row flex-grow-1 px-lg-5 py-4">

        <div class="col-md-4 mb-4 mb-md-0">
            <div class="p-4 bg-white border h-100 rounded d-flex flex-column justify-content-center">
                <h6 class="font-weight-bold mb-3">Profile Info</h6>

                <div class="mb-3">
                    <label class="small text-muted">Username</label>
                    <input type="text" class="form-control form-control-lg" placeholder="@username">
                    <small class="form-text text-muted">Public display name</small>
                </div>

                <button class="btn btn-primary btn-block mb-2">Update Profile</button>
                <button class="btn btn-outline-secondary btn-block">Clear</button>
            </div>
        </div>

        <div class="col-md-4 mb-4 mb-md-0">
            <div class="p-4 bg-white border h-100 rounded d-flex flex-column justify-content-center">
                <h6 class="font-weight-bold mb-3">Financials</h6>

                <div class="form-row mb-3">
                    <div class="col-8">
                        <input type="number" class="form-control form-control-lg" placeholder="Amount">
                    </div>
                    <div class="col-4">
                        <select class="custom-select custom-select-lg">
                            <option>USD</option>
                            <option>EUR</option>
                            <option>INR</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <button class="btn btn-outline-success btn-lg px-4">Proceed</button>

                    <div class="btn-group btn-group-toggle" data-toggle="buttons">
                        <label class="btn btn-secondary btn-sm active">
                            <input type="radio" name="currency"> Card
                        </label>
                        <label class="btn btn-outline-secondary btn-sm">
                            <input type="radio" name="currency"> Wallet
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="p-4 bg-white border h-100 rounded d-flex flex-column justify-content-center">
                <h6 class="font-weight-bold mb-3">System Updates</h6>

                <div class="form-row mb-4">
                    <div class="col-7">
                        <input type="text" class="form-control" placeholder="Recipient name">
                    </div>
                    <div class="col-5">
                        <select class="custom-select">
                            <option>@mail.com</option>
                            <option>@work.org</option>
                        </select>
                    </div>
                </div>

                <div class="custom-control custom-switch mb-2">
                    <input type="checkbox" class="custom-control-input" id="emailSwitch">
                    <label class="custom-control-label" for="emailSwitch">Email Notifications</label>
                </div>
                <div class="custom-control custom-switch">
                    <input type="checkbox" class="custom-control-input" id="smsSwitch">
                    <label class="custom-control-label" for="smsSwitch">SMS Alerts</label>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
