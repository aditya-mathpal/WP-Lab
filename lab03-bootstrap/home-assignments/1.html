<!-- 1. Design an attractive ‘train ticket booking form’ using different bootstrap elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <title>Train Ticket Booking Form</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <a class="navbar-brand" href="#">Train Ticket Booking</a>
</nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-info text-white">
            Passenger Details
        </div>

        <div class="card-body">
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" class="form-control" placeholder="Enter email">
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>From</label>
                        <input type="text" class="form-control" placeholder="Departure city">
                    </div>
                    <div class="form-group col-md-6">
                        <label>To</label>
                        <input type="text" class="form-control" placeholder="Destination city">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Travel Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="form-group col-md-6">
                        <label>Class</label>
                        <select class="form-control">
                            <option>All Classes</option>
                            <option>Anubhuti Class (EA)</option>
                            <option>AC First Class (1A)</option>
                            <option>Vistadome AC (EV)</option>
                            <option>Exec. Chair Car (EC)</option>
                            <option>AC 2 Tier (2A)</option>
                            <option>First Class (FC)</option>
                            <option>AC 3 Tier (3A)</option>
                            <option>AC 3 Economy (3E)</option>
                            <option>Vistadome Chair Car (VC)</option>
                            <option>AC Chair Car (CC)</option>
                            <option>Sleeper (SL)</option>
                            <option>Vistadome Non AC (VS)</option>
                            <option>Second Sitting (2S)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gender</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Female</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender">
                        <label class="form-check-label">Other</label>
                    </div>
                </div>
                
                <div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Person With Disability Concession</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Flexible With Date</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Railway Pass Concession</label>
                    </div>
                </div>
                <br>

                <button type="submit" class="btn btn-success">Search Trains</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
