<!-- 2. Design an attractive ‘magazine cover page’ using different bootstrap elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <title>Magazine Cover</title>
</head>

<body class="bg-dark">

<div class="container mt-4">

    <div class="card bg-secondary text-center shadow-lg">
        <div class="card-body">

            <h5 class="text-warning">January 2026 Edition</h5>
            <h1 class="display-3 font-weight-bold">TECH WORLD</h1>
            <p class="lead">The Future is Here</p>

            <img src="tech.jpg" width="25%" class="img-fluid rounded mt-3 mb-3">

            <div class="row text-left mt-4">
                <div class="col-md-6">
                    <h5>Inside This Issue</h5>
                    <ul class="list-group bg-secondary">
                        <li class="list-group-item">AI Changing Everyday Life</li>
                        <li class="list-group-item">Top 10 Gadgets of the Year</li>
                        <li class="list-group-item">Cybersecurity Basics</li>
                    </ul>
                </div>

                <div class="col-md-6">
                    <h5>Special Features</h5>
                    <ul class="list-group">
                        <li class="list-group-item">Interview with a Tech CEO</li>
                        <li class="list-group-item">Future of Space Travel</li>
                        <li class="list-group-item">Coding for Beginners</li>
                    </ul>
                </div>
            </div>

            <button class="btn btn-warning btn-lg mt-4">Subscribe Now</button>

        </div>
    </div>

</div>

</body>
</html>
