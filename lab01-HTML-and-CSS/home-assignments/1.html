<html>
  <head>
    <style>
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      td {
        text-align: right;
      }
    </style>
    <title>
      Table
    </title>
  </head>
  <body>
    <table>
      <colgroup>
        <col style="background-color:#FFE792; width:100px">
        <col style="background-color:#8FA8E0; width:150px">
        <col style="background-color:#AAD18E; width:125px">
      </colgroup>
      <tr style="background-color: #F80202;">
        <th>Country</th>
        <th colspan=2>Population (in Crores)</th>
      </tr>
      <tr>
        <th rowspan=3>INDIA</th>
        <td>1998</td>
        <td>85</td>
      </tr>
      <tr>
        <td>1999</td>
        <td>90</td>
      </tr>
      <tr>
        <td>2000</td>
        <td>100</td>
      </tr>
      <tr>
        <th rowspan=3>USA</th>
        <td>1998</td>
        <td>30</td>
      </tr>
      <tr>
        <td>1999</td>
        <td>35</td>
      </tr>
      <tr>
        <td>2000</td>
        <td>40</td>
      </tr>
      <tr>
        <th rowspan=3>UK</th>
        <td>1998</td>
        <td>25</td>
      </tr>
      <tr>
        <td>1999</td>
        <td>30</td>
      </tr>
      <tr>
        <td>2000</td>
        <td>35</td>
      </tr>
    </table>
  </body>
</html>
