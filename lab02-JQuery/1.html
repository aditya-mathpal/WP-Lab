<html>
  <head>
    <title>Table and Image Move</title>

    <script src="../jquery-3.7.1.min.js"></script>

    <style>
      table {
          border-collapse: collapse;
          width: 300px;
      }

      table, th, td {
          border: 1px solid black;
          padding: 10px;
          text-align: center;
      }

      tr:nth-child(even) {
          background-color: #d9ead3;
      }

      tr:nth-child(odd) {
          background-color: #fce5cd;
      }

      #container {
          position: relative;
          left: 500px;
          display: inline-block;
      }

      img {
          width: 150px;
          display: block;
          margin-top: 20px;
      }
    </style>
  </head>

  <body>

    <button id="moveBtn">Move Left</button>

    <br><br>

    <div id="container">
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
        </table>

        <img src="./cat.jpeg">
    </div>

    <script>
      $(function () {
          $("#moveBtn").click(function () {
              $("#container").animate({ left: "0px" }, 1000);
          });
      });
    </script>

  </body>
</html>
