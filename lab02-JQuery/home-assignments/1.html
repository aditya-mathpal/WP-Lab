<html>
  <head>
    <title>Tech Store</title>

    <script src="../../jquery-3.7.1.min.js"></script>

    <style>
      body {
        font-family: Arial;
      }

      select,
      input[type="text"] {
        width: 200px;
        margin-bottom: 10px;
      }

      #receipt {
        margin-top: 20px;
        padding: 10px;
        width: 300px;
        border: 1px solid black;
      }
    </style>
  </head>

  <body>

    <h3>Product Selection</h3>

    Brand:
    <br>
    <select id="brand">
      <option>HP</option>
      <option>Nokia</option>
      <option>Samsung</option>
      <option>Motorola</option>
      <option>Apple</option>
    </select>

    <br><br>

    Product Type:
    <br>
    <input type="checkbox" class="item" value="Mobile"> Mobile
    <br>
    <input type="checkbox" class="item" value="Laptop"> Laptop

    <br><br>

    Quantity:
    <br>
    <input type="text" id="qty">

    <br><br>

    <button id="bill">Produce Bill</button>

    <div id="receipt"></div>

    <script>
      $(function () {
        $("#bill").click(function () {

          let brand = $("#brand").val();
          let quantity = parseInt($("#qty").val());
          let total = 0;

          let prices = {
            "HP": { "Mobile": 15000, "Laptop": 55000 },
            "Nokia": { "Mobile": 12000, "Laptop": 45000 },
            "Samsung": { "Mobile": 40000, "Laptop": 80000 },
            "Motorola": { "Mobile": 13000, "Laptop": 48000 },
            "Apple": { "Mobile": 80000, "Laptop": 90000 }
          };

          let receipt = "<b>Bill Receipt</b><br>";
          receipt += "Brand: " + brand + "<br>";

          $(".item:checked").each(function () {
            let item = $(this).val();
            let price = prices[brand][item];
            receipt += item + " : " + price;
            receipt += " x" + quantity + "<br>";
            total += price;
          });

          total = total * quantity;

          receipt += "<br><b>Total Amount: " + total + "</b>";

          $("#receipt").html(receipt);
        });
      });
    </script>

  </body>
</html>
