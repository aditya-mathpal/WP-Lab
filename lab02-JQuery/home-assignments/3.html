<html>
  <head>
    <title>Sliding Text on Image</title>

    <script src="../../jquery-3.7.1.min.js"></script>

    <style>
      #container {
        width: 400px;
        position: relative;
      }

      #container img {
        width: 330px;
      }

      #text {
        position: absolute;
        top: 100px;
        left: 200px;
        color: white;
        font-size: 12px;
        font-weight: bold;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px;
      }
    </style>
  </head>

  <body>

    <div id="container">
      <img src="../cat.jpeg">
      <div id="text">Welcome to My Page</div>
    </div>

    <script>
      $(function () {

        function slideText() {
          $("#text").animate(
            { left: "0px" },
            2000,
            function () {
              $("#text").delay(1000).animate(
                { left: "200px" },
                2000,
                slideText
              );
            }
          );
        }

        slideText();

      });
    </script>

  </body>
</html>
